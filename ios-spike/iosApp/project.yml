name: PocketPassProbe
options:
  bundleIdPrefix: xyz.pocketpass
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    # Compose Multiplatform 1.12 publishes no iosX64, so the simulator is arm64-only.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64

targets:
  PocketPassProbe:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../../app/src/main/assets/mii_renderer
        name: mii_renderer
        type: folder
        buildPhase: resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: PP Probe
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../probe/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - Probe
    preBuildScripts:
      - name: Build the Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ../gradlew :probe:embedAndSignAppleFrameworkForXcode
