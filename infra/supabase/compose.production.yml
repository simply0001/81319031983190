services:
  board-media:
    build:
      context: ${POCKETPASS_INFRA_DIR:?POCKETPASS_INFRA_DIR is required}/board-media
    restart: unless-stopped
    depends_on:
      rest:
        condition: service_started
    environment:
      POSTGREST_URL: http://rest:3000
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1
  message-push:
    profiles: [push]
    build:
      context: ${POCKETPASS_INFRA_DIR:?POCKETPASS_INFRA_DIR is required}/push
    restart: unless-stopped
    depends_on:
      rest:
        condition: service_started
    environment:
      POSTGREST_URL: http://rest:3000
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
    volumes:
      - type: bind
        source: ${FIREBASE_SERVICE_ACCOUNT_FILE:-/opt/pocketpass/secrets/firebase-service-account.json}
        target: /run/secrets/firebase-service-account.json
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
  api-gw:
    ports: !reset []
    expose:
      - "8000"
      - "8443"
    environment:
      KONG_REAL_IP_HEADER: X-PocketPass-Client-IP
      KONG_REAL_IP_RECURSIVE: "on"
      KONG_TRUSTED_IPS: "172.30.77.0/24"
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,request-termination,ip-restriction,post-function,rate-limiting
      KONG_UNTRUSTED_LUA: sandbox
      KONG_NGINX_MAIN_WORKER_RLIMIT_NOFILE: "65536"
      KONG_NGINX_EVENTS_WORKER_CONNECTIONS: "16384"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ${POCKETPASS_INFRA_DIR:?POCKETPASS_INFRA_DIR is required}/kong/kong.yml:/home/kong/temp.yml:ro
      - ${POCKETPASS_INFRA_DIR:?POCKETPASS_INFRA_DIR is required}/kong/kong-entrypoint.sh:/home/kong/kong-entrypoint.sh:ro

  supavisor:
    ports: !reset []
    expose:
      - "5432"
      - "6543"

  functions:
    profiles:
      - disabled

  realtime:
    environment:
      API_JWT_JWKS: ${JWT_JWKS}
      SEED_SELF_HOST: "false"
      RLIMIT_NOFILE: "65536"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  rest:
    environment:
      PGRST_DB_POOL: "25"
      PGRST_DB_PRE_REQUEST: public.pocketpass_request_guard

  storage:
    environment:
      JWT_JWKS: ${JWT_JWKS}

  auth:
    environment:
      GOTRUE_JWT_KEYS: ${JWT_KEYS}
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
      GOTRUE_API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      GOTRUE_OAUTH_SERVER_ENABLED: ${PUBLIC_API_ENABLED:-false}
      GOTRUE_OAUTH_SERVER_AUTHORIZATION_PATH: /oauth/consent
      GOTRUE_OAUTH_SERVER_ALLOW_DYNAMIC_REGISTRATION: "false"
      GOTRUE_OAUTH_SERVER_DEFAULT_SCOPE: openid
      GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_ENABLED: ${PUBLIC_API_ENABLED:-false}
      GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_URI: pg-functions://postgres/public/pocketpass_access_token_hook
      GOTRUE_HOOK_BEFORE_USER_CREATED_ENABLED: "true"
      GOTRUE_HOOK_BEFORE_USER_CREATED_URI: pg-functions://postgres/public/pocketpass_before_user_created
      GOTRUE_SECURITY_UPDATE_PASSWORD_REQUIRE_REAUTHENTICATION: "true"
      GOTRUE_PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-8}
      GOTRUE_MAILER_SECURE_EMAIL_CHANGE_ENABLED: "false"
      GOTRUE_MAILER_OTP_EXP: ${EMAIL_OTP_EXPIRY_SECONDS:-600}
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: ${EMAIL_OTP_TEMPLATE_URL}
      GOTRUE_MAILER_SUBJECTS_MAGIC_LINK: ${EMAIL_OTP_SUBJECT:-Your PocketPass verification code}
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: ${EMAIL_OTP_TEMPLATE_URL}
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: ${EMAIL_OTP_SUBJECT:-Your PocketPass verification code}
      GOTRUE_MAILER_TEMPLATES_RECOVERY: ${EMAIL_OTP_TEMPLATE_URL}
      GOTRUE_MAILER_SUBJECTS_RECOVERY: ${EMAIL_OTP_SUBJECT:-Your PocketPass verification code}
      GOTRUE_MAILER_TEMPLATES_EMAIL_CHANGE: ${EMAIL_OTP_TEMPLATE_URL}
      GOTRUE_MAILER_SUBJECTS_EMAIL_CHANGE: ${EMAIL_OTP_SUBJECT:-Your PocketPass verification code}
      GOTRUE_MAILER_TEMPLATES_REAUTHENTICATION: ${EMAIL_OTP_TEMPLATE_URL}
      GOTRUE_MAILER_SUBJECTS_REAUTHENTICATION: ${EMAIL_OTP_SUBJECT:-Your PocketPass verification code}
      GOTRUE_SECURITY_CAPTCHA_ENABLED: "false"
      GOTRUE_SMTP_MAX_FREQUENCY: ${SMTP_MAX_FREQUENCY:-60s}
      GOTRUE_RATE_LIMIT_EMAIL_SENT: ${AUTH_EMAILS_PER_HOUR:-1000}
      GOTRUE_EXTERNAL_DISCORD_ENABLED: ${DISCORD_ENABLED:-false}
      GOTRUE_EXTERNAL_DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      GOTRUE_EXTERNAL_DISCORD_SECRET: ${DISCORD_CLIENT_SECRET}
      GOTRUE_EXTERNAL_DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: "465"
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}

  caddy:
    image: ${CADDY_IMAGE:?CADDY_IMAGE must be pinned by tag and digest}
    restart: unless-stopped
    depends_on:
      api-gw:
        condition: service_healthy
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?SUPABASE_PUBLISHABLE_KEY is required}
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - ${POCKETPASS_INFRA_DIR:?POCKETPASS_INFRA_DIR is required}/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${POCKETPASS_INFRA_DIR:?POCKETPASS_INFRA_DIR is required}/caddy/site:/srv/links:ro
      - ${POCKETPASS_INFRA_DIR:?POCKETPASS_INFRA_DIR is required}/templates:/srv/templates:ro
      - ${POCKETPASS_INFRA_DIR:?POCKETPASS_INFRA_DIR is required}/updates:/srv/updates:ro
      - ${POCKETPASS_INFRA_DIR:?POCKETPASS_INFRA_DIR is required}/admin:/srv/admin:ro
      - ${POCKETPASS_INFRA_DIR:?POCKETPASS_INFRA_DIR is required}/developer:/srv/developer:ro
      - ${POCKETPASS_INFRA_DIR:?POCKETPASS_INFRA_DIR is required}/website:/srv/website:ro
      - ${POCKETPASS_INFRA_DIR:?POCKETPASS_INFRA_DIR is required}/studio:/srv/studio:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    networks:
      - default

volumes:
  caddy_data:
  caddy_config:

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.77.0/24
