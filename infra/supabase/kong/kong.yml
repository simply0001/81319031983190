_format_version: '2.1'
_transform: true

consumers:
  - username: anon
    keyauth_credentials:
      - key: $SUPABASE_ANON_KEY
      - key: $SUPABASE_PUBLISHABLE_KEY
  - username: service_role
    keyauth_credentials:
      - key: $SUPABASE_SERVICE_KEY
      - key: $SUPABASE_SECRET_KEY

acls:
  - consumer: anon
    group: anon
  - consumer: service_role
    group: admin

services:
  - name: auth-v1-open
    _comment: 'Auth: /auth/v1/verify* -> http://auth:9999/verify*'
    url: http://auth:9999/verify
    routes:
      - name: auth-v1-open
        strip_path: true
        paths:
          - /auth/v1/verify
    plugins:
      - name: cors
  - name: auth-v1-open-callback
    _comment: 'Auth: /auth/v1/callback* -> http://auth:9999/callback*'
    url: http://auth:9999/callback
    routes:
      - name: auth-v1-open-callback
        strip_path: true
        paths:
          - /auth/v1/callback
    plugins:
      - name: cors
  - name: auth-v1-open-authorize
    _comment: 'Auth: /auth/v1/authorize* -> http://auth:9999/authorize*'
    url: http://auth:9999/authorize
    routes:
      - name: auth-v1-open-authorize
        strip_path: true
        paths:
          - /auth/v1/authorize
    plugins:
      - name: cors
  - name: auth-v1-open-jwks
    _comment: 'Auth: /auth/v1/.well-known/jwks.json -> http://auth:9999/.well-known/jwks.json'
    url: http://auth:9999/.well-known/jwks.json
    routes:
      - name: auth-v1-open-jwks
        strip_path: true
        paths:
          - /auth/v1/.well-known/jwks.json
    plugins:
      - name: cors
  - name: auth-v1-open-oauth-authorize
    _comment: 'Auth: GET /auth/v1/oauth/authorize (S256 only) -> http://auth:9999/oauth/authorize'
    url: http://auth:9999/oauth/authorize
    routes:
      - name: auth-v1-open-oauth-authorize
        strip_path: true
        expression: 'http.method == "GET" && http.path == "/auth/v1/oauth/authorize" && http.queries.code_challenge_method == "S256"'
    plugins:
      - name: cors
      - name: rate-limiting
        config:
          limit_by: ip
          minute: 30
          hour: 300
          policy: local
          hide_client_headers: false
          fault_tolerant: false
  - name: auth-v1-oauth-authorize-plain-blocked
    _comment: 'Auth: GET /auth/v1/oauth/authorize with code_challenge_method=plain -> 400 (S256 only)'
    url: http://auth:9999/oauth/authorize
    routes:
      - name: auth-v1-oauth-authorize-plain-blocked
        strip_path: true
        expression: 'http.path == "/auth/v1/oauth/authorize" && http.queries.code_challenge_method == "plain"'
    plugins:
      - name: request-termination
        config:
          status_code: 400
          message: "code_challenge_method must be S256"
  - name: auth-v1-open-oauth-token
    _comment: 'Auth: exact POST /auth/v1/oauth/token -> http://auth:9999/oauth/token'
    url: http://auth:9999/oauth/token
    routes:
      - name: auth-v1-open-oauth-token
        strip_path: true
        expression: 'http.method == "POST" && http.path == "/auth/v1/oauth/token"'
    plugins:
      - name: cors
      - name: rate-limiting
        config:
          limit_by: ip
          minute: 30
          hour: 300
          policy: local
          hide_client_headers: false
          fault_tolerant: false
  - name: auth-v1-open-oauth-userinfo
    _comment: 'Auth: exact GET /auth/v1/oauth/userinfo -> http://auth:9999/oauth/userinfo'
    url: http://auth:9999/oauth/userinfo
    routes:
      - name: auth-v1-open-oauth-userinfo
        strip_path: true
        expression: 'http.method == "GET" && http.path == "/auth/v1/oauth/userinfo"'
    plugins:
      - name: cors
  - name: auth-v1-open-openid-configuration
    _comment: 'Auth: /auth/v1/.well-known/openid-configuration -> http://auth:9999/.well-known/openid-configuration'
    url: http://auth:9999/.well-known/openid-configuration
    routes:
      - name: auth-v1-open-openid-configuration
        strip_path: true
        expression: 'http.method == "GET" && http.path == "/auth/v1/.well-known/openid-configuration"'
    plugins:
      - name: cors

  - name: auth-v1-open-sso-acs
    url: "http://auth:9999/sso/saml/acs"
    routes:
      - name: auth-v1-open-sso-acs
        strip_path: true
        paths:
        - /auth/v1/sso/saml/acs
    plugins:
      - name: cors

  - name: auth-v1-open-sso-metadata
    url: "http://auth:9999/sso/saml/metadata"
    routes:
      - name: auth-v1-open-sso-metadata
        strip_path: true
        paths:
        - /auth/v1/sso/saml/metadata
    plugins:
      - name: cors

  - name: auth-v1-otp
    _comment: 'Auth: exact POST /auth/v1/otp -> http://auth:9999/otp'
    url: http://auth:9999/otp
    routes:
      - name: auth-v1-otp
        strip_path: true
        expression: 'http.method == "POST" && http.path == "/auth/v1/otp"'
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: request-transformer
        config:
          add:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
          replace:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon
      - name: rate-limiting
        config:
          limit_by: ip
          minute: 10
          hour: 60
          policy: local
          hide_client_headers: false
          fault_tolerant: false

  - name: auth-v1-signup
    _comment: 'Auth: exact POST /auth/v1/signup -> http://auth:9999/signup (username accounts only; email OTP uses /otp)'
    url: http://auth:9999/signup
    routes:
      - name: auth-v1-signup
        strip_path: true
        expression: 'http.method == "POST" && http.path == "/auth/v1/signup"'
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: request-transformer
        config:
          add:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
          replace:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon
      - name: rate-limiting
        config:
          limit_by: ip
          minute: 5
          hour: 20
          policy: local
          hide_client_headers: false
          fault_tolerant: false
      - name: post-function
        config:
          access:
            - |
              local body = kong.request.get_body("application/json")
              local email = type(body) == "table" and body.email or nil
              if type(email) ~= "string" or not email:lower():match("^[^@]+@users%.pocketpass%.xyz$") then
                return kong.response.exit(400, { error = "username_signup_required", error_description = "Use email OTP for an email-address account." })
              end

  - name: auth-v1-token-password
    _comment: 'Auth: exact POST /auth/v1/token?grant_type=password -> http://auth:9999/token'
    url: http://auth:9999/token
    routes:
      - name: auth-v1-token-password
        strip_path: true
        expression: 'http.method == "POST" && http.path == "/auth/v1/token" && http.queries.grant_type == "password"'
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: request-transformer
        config:
          add:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
          replace:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon
      - name: rate-limiting
        config:
          limit_by: ip
          minute: 10
          hour: 60
          policy: local
          hide_client_headers: false
          fault_tolerant: false

  - name: auth-v1-user-update
    _comment: 'Auth: exact PUT /auth/v1/user -> http://auth:9999/user (email link, password change)'
    url: http://auth:9999/user
    routes:
      - name: auth-v1-user-update
        strip_path: true
        expression: 'http.method == "PUT" && http.path == "/auth/v1/user"'
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: request-transformer
        config:
          add:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
          replace:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon
      - name: rate-limiting
        config:
          limit_by: ip
          minute: 10
          hour: 60
          policy: local
          hide_client_headers: false
          fault_tolerant: false
      - name: post-function
        config:
          access:
            - |
              local auth = kong.request.get_header("authorization")
              if auth ~= nil and auth ~= "" then
                local token = auth:match("^%s*[Bb][Ee][Aa][Rr][Ee][Rr]%s+(%S+)")
                if token ~= nil then
                  local seg = token:match("^[%w%-_]+%.([%w%-_]+)%.[%w%-_]*$")
                  if seg ~= nil then
                    local b = seg:gsub("%-", "+"):gsub("_", "/")
                    b = b .. ("="):rep((4 - #b % 4) % 4)
                    local payload = ngx.decode_base64(b)
                    if payload == nil then
                      return kong.response.exit(403, { error = "oauth_client_forbidden", error_description = "Token could not be inspected." })
                    end
                    if payload:find('"client_id"', 1, true) ~= nil then
                      return kong.response.exit(403, { error = "oauth_client_forbidden", error_description = "Connected apps cannot use this endpoint. Use /v1/session.get or /auth/v1/oauth/userinfo." })
                    end
                  end
                end
              end

  - name: auth-v1-reauthenticate
    _comment: 'Auth: exact GET /auth/v1/reauthenticate -> http://auth:9999/reauthenticate (sends a code)'
    url: http://auth:9999/reauthenticate
    routes:
      - name: auth-v1-reauthenticate
        strip_path: true
        expression: 'http.method == "GET" && http.path == "/auth/v1/reauthenticate"'
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: request-transformer
        config:
          add:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
          replace:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon
      - name: rate-limiting
        config:
          limit_by: ip
          minute: 5
          hour: 20
          policy: local
          hide_client_headers: false
          fault_tolerant: false
      - name: post-function
        config:
          access:
            - |
              local auth = kong.request.get_header("authorization")
              if auth ~= nil and auth ~= "" then
                local token = auth:match("^%s*[Bb][Ee][Aa][Rr][Ee][Rr]%s+(%S+)")
                if token ~= nil then
                  local seg = token:match("^[%w%-_]+%.([%w%-_]+)%.[%w%-_]*$")
                  if seg ~= nil then
                    local b = seg:gsub("%-", "+"):gsub("_", "/")
                    b = b .. ("="):rep((4 - #b % 4) % 4)
                    local payload = ngx.decode_base64(b)
                    if payload == nil then
                      return kong.response.exit(403, { error = "oauth_client_forbidden", error_description = "Token could not be inspected." })
                    end
                    if payload:find('"client_id"', 1, true) ~= nil then
                      return kong.response.exit(403, { error = "oauth_client_forbidden", error_description = "Connected apps cannot use this endpoint. Use /v1/session.get or /auth/v1/oauth/userinfo." })
                    end
                  end
                end
              end

  - name: auth-v1-recover-blocked
    _comment: 'Auth: /auth/v1/recover -> 404 (PocketPass passwords cannot be reset)'
    url: http://auth:9999/recover
    routes:
      - name: auth-v1-recover-blocked
        strip_path: true
        expression: 'http.path == "/auth/v1/recover"'
    plugins:
      - name: request-termination
        config:
          status_code: 404
          message: "Password recovery is not available"

  - name: auth-v1
    _comment: 'Auth: /auth/v1/* -> http://auth:9999/*'
    url: http://auth:9999/
    routes:
      - name: auth-v1-all
        strip_path: true
        paths:
          - /auth/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: request-transformer
        config:
          add:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
          replace:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon
      - name: post-function
        config:
          access:
            - |
              -- Keep variant signup paths from bypassing the exact username-only route.
              local path = ngx.unescape_uri(kong.request.get_path()):lower()
              if kong.request.get_method() == "POST" and path:find("signup", 1, true) then
                return kong.response.exit(404, { error = "not_found" })
              end
              local auth = kong.request.get_header("authorization")
              if auth ~= nil and auth ~= "" then
                local token = auth:match("^%s*[Bb][Ee][Aa][Rr][Ee][Rr]%s+(%S+)")
                if token ~= nil then
                  local seg = token:match("^[%w%-_]+%.([%w%-_]+)%.[%w%-_]*$")
                  if seg ~= nil then
                    local b = seg:gsub("%-", "+"):gsub("_", "/")
                    b = b .. ("="):rep((4 - #b % 4) % 4)
                    local payload = ngx.decode_base64(b)
                    if payload == nil then
                      return kong.response.exit(403, { error = "oauth_client_forbidden", error_description = "Token could not be inspected." })
                    end
                    if payload:find('"client_id"', 1, true) ~= nil then
                      return kong.response.exit(403, { error = "oauth_client_forbidden", error_description = "Connected apps cannot use this endpoint. Use /v1/session.get or /auth/v1/oauth/userinfo." })
                    end
                  end
                end
              end

  - name: rest-v1-resolve-friend-code
