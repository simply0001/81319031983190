  - name: storage-v1
    _comment: 'Storage: /storage/v1/* -> http://storage:5000/*'
    url: http://storage:5000/
    routes:
      - name: storage-v1-all
        strip_path: true
        paths:
          - /storage/v1/
    plugins:
      - name: cors
      - name: request-transformer
        config:
          add:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
          replace:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
      - name: post-function
        config:
          access:
            - |
              local auth = kong.request.get_header("authorization")
              if auth == nil or auth == "" or auth:find("^%s*$") then
                kong.service.request.clear_header("authorization")
              else
                local token = auth:match("^%s*[Bb][Ee][Aa][Rr][Ee][Rr]%s+(%S+)")
                if token ~= nil then
                  local seg = token:match("^[%w%-_]+%.([%w%-_]+)%.[%w%-_]*$")
                  if seg ~= nil then
                    local b = seg:gsub("%-", "+"):gsub("_", "/")
                    b = b .. ("="):rep((4 - #b % 4) % 4)
                    local payload = ngx.decode_base64(b)
                    if payload == nil then
                      return kong.response.exit(403, { error = "oauth_client_forbidden", error_description = "Token could not be inspected." })
                    end
                    if payload:find('"client_id"', 1, true) ~= nil and payload:find('"role":"api_client"', 1, true) == nil then
                      return kong.response.exit(403, { error = "oauth_client_forbidden", error_description = "Connected-app token is not scoped. Reconnect the app." })
                    end
                  end
                end
              end
              if kong.request.get_method() == "POST" and kong.request.get_path():find("/storage/v1/object/sign/", 1, true) == 1 then
                local body = kong.request.get_body("application/json")
                if type(body) ~= "table" then
                  return kong.response.exit(400, { error = "invalid_sign_request" })
                end
                local ttl = tonumber(body.expiresIn)
                if ttl == nil or ttl > 900 then
                  body.expiresIn = 900
                end
                kong.service.request.set_body(body, "application/json")
              end

