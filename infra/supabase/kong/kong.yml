    plugins:
      - name: request-termination
        config:
          status_code: 404
          message: "Use https://api.pocketpass.xyz/webhooks/kofi"

  - name: rest-v1
    _comment: 'PostgREST: /rest/v1/* -> http://rest:3000/*'
    url: http://rest:3000/
    routes:
      - name: rest-v1-all
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: request-transformer
        config:
          add:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
          replace:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon
      - name: post-function
        config:
          access:
            - |
              local auth = kong.request.get_header("authorization")
              if auth ~= nil and auth ~= "" then
                local token = auth:match("^%s*[Bb][Ee][Aa][Rr][Ee][Rr]%s+(%S+)")
                if token ~= nil then
                  local seg = token:match("^[%w%-_]+%.([%w%-_]+)%.[%w%-_]*$")
                  if seg ~= nil then
                    local b = seg:gsub("%-", "+"):gsub("_", "/")
                    b = b .. ("="):rep((4 - #b % 4) % 4)
                    local payload = ngx.decode_base64(b)
                    if payload == nil then
                      return kong.response.exit(403, { error = "oauth_client_forbidden", error_description = "Token could not be inspected." })
                    end
                    if payload:find('"client_id"', 1, true) ~= nil and payload:find('"role":"api_client"', 1, true) == nil then
                      return kong.response.exit(403, { error = "oauth_client_forbidden", error_description = "Connected-app token is not scoped. Reconnect the app." })
                    end
                  end
                end
              end

  - name: graphql-v1
