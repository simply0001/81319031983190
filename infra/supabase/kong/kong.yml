  - name: rest-v1-submit-nearby-encounter
    _comment: 'PostgREST: exact POST /rest/v1/rpc/submit_nearby_encounter'
    url: http://rest:3000/rpc/submit_nearby_encounter
    routes:
      - name: rest-v1-submit-nearby-encounter
        strip_path: true
        expression: 'http.method == "POST" && http.path == "/rest/v1/rpc/submit_nearby_encounter"'
    plugins:
      - name: cors
