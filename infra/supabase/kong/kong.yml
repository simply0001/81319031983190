            - anon
      - name: rate-limiting
        config:
          limit_by: ip
          minute: 10
          hour: 50
          policy: local
          fault_tolerant: true
          hide_client_headers: false

  - name: rest-v1-issue-nearby-credentials
    _comment: 'PostgREST: exact POST /rest/v1/rpc/issue_nearby_credentials'
    url: http://rest:3000/rpc/issue_nearby_credentials
    routes:
      - name: rest-v1-issue-nearby-credentials
        strip_path: true
        expression: 'http.method == "POST" && http.path == "/rest/v1/rpc/issue_nearby_credentials"'
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: request-transformer
        config:
          add:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
          replace:
