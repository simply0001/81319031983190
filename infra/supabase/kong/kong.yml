  - name: rest-v1-openapi
    _comment: 'PostgREST OpenAPI root: /rest/v1/ -> <http://rest:3000/> (admin only). See <https://github.com/orgs/supabase/discussions/42949>'
    url: http://rest:3000/
    routes:
      - name: rest-v1-openapi-root
        strip_path: true
        expression: 'http.path == "/rest/v1/"'
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: request-transformer
        config:
          add:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
          replace:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin

  - name: rest-v1-api-v1
    _comment: 'PostgREST: /pp-api/rpc/api_v1_* (Caddy rewrite of /v1/<resource>.<action>) -> http://rest:3000/rpc/api_v1_*'
    url: http://rest:3000/
    routes:
      - name: rest-v1-api-v1
        strip_path: true
        expression: '(http.method == "POST" || http.method == "OPTIONS") && http.path ^= "/pp-api/"'
    plugins:
      - name: cors
        config:
          max_age: 86400
          exposed_headers:
            - RateLimit-Remaining
            - RateLimit-Reset
            - Retry-After
      - name: key-auth
        config:
          hide_credentials: false
      - name: request-transformer
        config:
          add:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
          replace:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon
      - name: rate-limiting
        config:
          limit_by: ip
          minute: 6000
          hour: 200000
          policy: local
          fault_tolerant: true
          hide_client_headers: false

  - name: rest-v1-api-v1-blocked
    _comment: 'PostgREST: /rest/v1/rpc/api_v1_* -> 404, /v1/<resource>.<action> is the only entry (blocked)'
    url: http://rest:3000/
    routes:
      - name: rest-v1-api-v1-blocked
        strip_path: true
        expression: 'http.path ^= "/rest/v1/rpc/api_v1_"'
    plugins:
      - name: request-termination
        config:
          status_code: 404
          message: "Use https://api.pocketpass.xyz/v1/"

  - name: rest-v1-kofi-webhook
