<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="supported-color-schemes" content="light">
    <title>Your PocketPass verification code</title>
    <style>
      @media only screen and (max-width: 620px) {
        .pocketpass-shell { padding: 20px 12px !important; }
        .pocketpass-card { border-width: 6px !important; }
        .pocketpass-content { padding: 34px 22px 32px !important; }
        .pocketpass-title { font-size: 30px !important; }
        .pocketpass-code { font-size: 40px !important; letter-spacing: 8px !important; }
      }
    </style>
  </head>
  <body style="background:#92ebae;margin:0;padding:0">
    <div style="display:none;font-size:1px;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden">
      Your PocketPass verification code is {{ .Token }}.
    </div>
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="border-collapse:collapse">
      <tr>
        <td
          class="pocketpass-shell"
          align="center"
          background="https://links.pocketpass.xyz/auth-email/assets/pocketpass-pattern.png"
          style="background-color:#92ebae;background-image:linear-gradient(180deg,rgba(233,246,244,.86) 0%,rgba(233,246,244,.86) 42%,rgba(146,235,174,.84) 100%),url('https://links.pocketpass.xyz/auth-email/assets/pocketpass-pattern.png');background-position:center top;background-repeat:repeat;background-size:960px 540px;padding:38px 16px"
        >
          <table
            role="presentation"
            cellpadding="0"
            cellspacing="0"
            border="0"
            width="100%"
            class="pocketpass-card"
            style="background:#f6fff8;border:8px solid #5e9aac;border-collapse:separate;border-radius:42px;box-shadow:0 12px 0 rgba(29,89,107,.34);max-width:600px;overflow:hidden"
          >
            <tr>
              <td class="pocketpass-content" align="center" style="padding:42px 44px 40px">
                <img
                  src="https://links.pocketpass.xyz/auth-email/assets/pocketpass-leaf.png?v=2"
                  alt="PocketPass"
                  width="112"
                  style="border:0;display:block;height:auto;margin:0 auto 10px;max-width:112px;outline:none"
                >
                <div style="color:#1d596b;font-family:'Rubik','Trebuchet MS',Arial,sans-serif;font-size:38px;font-weight:700;line-height:1.1;margin:0 0 34px">
                  PocketPass
                </div>
                <h1 class="pocketpass-title" style="color:#1d596b;font-family:'Rubik','Trebuchet MS',Arial,sans-serif;font-size:36px;font-weight:700;line-height:1.2;margin:0 0 12px">
                  Here's your code!
                </h1>
                <p style="color:#26706a;font-family:'Rubik','Trebuchet MS',Arial,sans-serif;font-size:19px;font-weight:600;line-height:1.5;margin:0 0 28px">
                  Enter this 6-digit code in PocketPass.
                </p>
                <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="border-collapse:separate">
                  <tr>
                    <td
                      align="center"
                      style="background:linear-gradient(180deg,#ffffff 0%,#ffffff 68%,#bdf8cb 100%);border:7px solid #55c24b;border-radius:30px;box-shadow:0 9px 0 rgba(0,0,0,.18);padding:22px 12px"
                    >
                      <div class="pocketpass-code" style="color:#1d596b;font-family:'Rubik','Trebuchet MS',Arial,sans-serif;font-size:48px;font-weight:700;letter-spacing:12px;line-height:1;margin-left:12px">
                        {{ .Token }}
                      </div>
                    </td>
                  </tr>
                </table>
                <p style="color:rgba(38,112,106,.78);font-family:'Rubik','Trebuchet MS',Arial,sans-serif;font-size:15px;font-weight:600;line-height:1.5;margin:30px 0 0">
                  This code expires in 10 minutes.
                </p>
                <p style="color:#26706a;font-family:'Rubik','Trebuchet MS',Arial,sans-serif;font-size:15px;line-height:1.55;margin:8px 0 0">
                  PocketPass will never ask you to share this code.
                </p>
              </td>
            </tr>
          </table>
          <p style="color:#1d596b;font-family:'Rubik','Trebuchet MS',Arial,sans-serif;font-size:13px;line-height:1.5;margin:28px auto 0;max-width:560px">
            If you didn't request this code, you can safely ignore this email.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
