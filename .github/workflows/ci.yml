name: CI

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - 'infra/**'
      - '**/*.md'
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android + shared
    # Actions minutes are only free on the public mirror; the private repo would bill them.
    if: github.repository == 'simply0001/81319031983190'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Type-check shared and ui against every target
        run: ./gradlew :shared:compileCommonMainKotlinMetadata :ui:compileCommonMainKotlinMetadata --console=plain
      - name: Build the Android app
        run: ./gradlew :app:assembleDebug --console=plain
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest :shared:allTests :ui:testAndroidHostTest --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: '**/test-results/**/*.xml'

  ios:
    name: shared for iOS
    if: github.repository == 'simply0001/81319031983190'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache the Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-
      - name: Link the simulator frameworks
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 :ui:linkDebugFrameworkIosSimulatorArm64 --console=plain
      # Release-mode Kotlin/Native runs whole-program optimisation with no incremental
      # cache (~24 minutes for the ui module), and IPA builds exercise it anyway, so
      # per-push runs stick to the simulator link and this step waits for manual runs.
      - name: Link the device frameworks
        if: github.event_name == 'workflow_dispatch'
        run: ./gradlew :shared:linkReleaseFrameworkIosArm64 :ui:linkReleaseFrameworkIosArm64 --console=plain
      - name: iOS unit tests
        run: ./gradlew :shared:iosSimulatorArm64Test --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results
          path: '**/test-results/**/*.xml'
