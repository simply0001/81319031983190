name: iOS smoke

on:
  workflow_dispatch:

concurrency:
  group: ios-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launch:
    name: Simulator launch check (macOS)
    # Actions minutes are only free on the public mirror; the private repo would bill them.
    if: github.repository == 'simply0001/81319031983190'
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache the Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        working-directory: ios-app
        run: xcodegen generate
      - name: Build for the simulator
        working-directory: ios-app
        run: |
          xcodebuild \
            -project PocketPass.xcodeproj \
            -scheme PocketPass \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
      - name: Launch and watch for a crash
        working-directory: ios-app
        run: |
          set -x
          DEVICE_TYPE=$(xcrun simctl list devicetypes | grep -oE 'iPhone 1[56][^(]*\(com[^)]*\)' | tail -1 | grep -oE 'com[^)]*')
          RUNTIME=$(xcrun simctl list runtimes | grep -oE 'com.apple.CoreSimulator.SimRuntime.iOS[^ )]*' | tail -1)
          UDID=$(xcrun simctl create smoke "$DEVICE_TYPE" "$RUNTIME")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          APP=build/DerivedData/Build/Products/Debug-iphonesimulator/PocketPass.app
          xcrun simctl install "$UDID" "$APP"
          # A detached launch: tying the app to a console-pty session would kill
          # it when the watcher exits. Simulator apps are host processes, so the
          # printed PID works with plain ps.
          LAUNCH_OUT=$(xcrun simctl launch \
            --stdout="$PWD/launch-stdout.txt" \
            --stderr="$PWD/launch-stderr.txt" \
            "$UDID" xyz.pocketpass.PocketPass)
          echo "$LAUNCH_OUT"
          APP_PID=$(echo "$LAUNCH_OUT" | awk '{print $NF}')
          sleep 30
          if ps -p "$APP_PID" > /dev/null; then ALIVE=1; else ALIVE=0; fi
          echo "alive: $ALIVE"
          echo "=== stdout tail ==="
          tail -n 100 launch-stdout.txt || true
          echo "=== stderr tail ==="
          tail -n 150 launch-stderr.txt || true
          mkdir -p crash-reports
          cp ~/Library/Logs/DiagnosticReports/PocketPass* crash-reports/ 2>/dev/null || true
          ls -la crash-reports || true
          if [ -n "$(ls -A crash-reports 2>/dev/null)" ] || \
             grep -q "Uncaught Kotlin exception" launch-stderr.txt launch-stdout.txt; then
            echo "::error::PocketPass crashed at launch on the simulator"
            for f in crash-reports/*; do
              echo "=== $f (head) ==="
              head -c 20000 "$f" || true
            done
            exit 1
          fi
          if [ "$ALIVE" = "0" ]; then
            echo "::error::PocketPass is not running after 30s and left no crash report"
            exit 1
          fi
          echo "PocketPass is alive on the simulator."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-launch-logs
          path: |
            ios-app/launch-stdout.txt
            ios-app/launch-stderr.txt
            ios-app/crash-reports/
          if-no-files-found: ignore
