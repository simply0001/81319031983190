name: iOS app

on:
  workflow_dispatch:

concurrency:
  group: ios-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    name: PocketPass IPA (macOS)
    if: github.repository == 'simply0001/81319031983190'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache the Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        working-directory: ios-app
        run: xcodegen generate
      - name: Build for a device, unsigned
        working-directory: ios-app
        env:
          POCKETPASS_BACKEND_ENABLED: 'true'
          POCKETPASS_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.POCKETPASS_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          xcodebuild \
            -project PocketPass.xcodeproj \
            -scheme PocketPass \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
      - name: Package the IPA
        working-directory: ios-app
        run: |
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/PocketPass.app build/Payload/
          cd build
          zip -qry PocketPass.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: PocketPass-ipa
          path: ios-app/build/PocketPass.ipa
