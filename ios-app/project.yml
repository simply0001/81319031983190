name: PocketPass
options:
  bundleIdPrefix: xyz.pocketpass
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    exactVersion: 12.19.1

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 72PMGDSD3B
    MARKETING_VERSION: "0.1.8"
    CURRENT_PROJECT_VERSION: "21"
    # Compose Multiplatform 1.12 publishes no iosX64, so the simulator is arm64-only.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64

targets:
  PocketPass:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      - path: Resources/PrivacyInfo.xcprivacy
      - path: Config/GoogleService-Info.plist
        optional: true
        buildPhase: resources
      - path: Resources/audio
        name: audio
        type: folder
        buildPhase: resources
      - path: ../app/src/main/assets/mii_renderer
        name: mii_renderer
        type: folder
        buildPhase: resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: PocketPass
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        FirebaseAppDelegateProxyEnabled: false
        FirebaseMessagingAutoInitEnabled: false
        FIREBASE_ANALYTICS_COLLECTION_ENABLED: false
        # Required by Compose Multiplatform: its PlistSanityCheck aborts the
        # process at launch when this entry is absent, and high-refresh iPhones
        # render at 60Hz without it.
        CADisableMinimumFrameDurationOnPhone: true
        UILaunchScreen: {}
        # Discord OAuth redirects back through this scheme (allowlisted
        # server-side as pocketpass://auth/callback).
        CFBundleURLTypes:
          - CFBundleURLName: xyz.pocketpass.auth
            CFBundleURLSchemes:
              - pocketpass
        # fetch: opportunistic background sync via BGTaskScheduler (the
        # identifier must match IosBackgroundRefresh.TASK_IDENTIFIER).
        # bluetooth-central/peripheral: street-pass keeps exchanging passes
        # with the phone pocketed.
        UIBackgroundModes: [fetch, bluetooth-central, bluetooth-peripheral]
        NSBluetoothAlwaysUsageDescription:
          PocketPass exchanges anonymous encounter passes with nearby players
          over Bluetooth, including while the app is in the background.
        NSMotionUsageDescription: PocketPass reads your daily step count to award tokens for walking.
        BGTaskSchedulerPermittedIdentifiers:
          - xyz.pocketpass.refresh
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    # The widget shares its data through this group; the same identifier is
    # declared on the extension target below.
    entitlements:
      path: Sources/PocketPass.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
        com.apple.security.application-groups:
          - group.xyz.pocketpass
    dependencies:
      - target: PocketPassWidget
      - package: Firebase
        product: FirebaseMessaging
      - package: Firebase
        product: FirebaseCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.pocketpass.PocketPass
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PROVISIONING_PROFILE_SPECIFIER: $(POCKETPASS_APP_PROFILE)
        TARGETED_DEVICE_FAMILY: "1,2"
        APS_ENVIRONMENT: development
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../ui/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - PocketPassUi
      configs:
        Release:
          APS_ENVIRONMENT: production
    preBuildScripts:
      - name: Build the Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :ui:embedAndSignAppleFrameworkForXcode

  # Pure-Swift WidgetKit extension: it never links the Kotlin framework and
  # only reads the JSON snapshot the app writes into the App Group.
  PocketPassWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Widget
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: PocketPass
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        # Rubik faces copied from ui/src/commonMain/composeResources/font.
        UIAppFonts:
          - rubik_500.ttf
          - rubik_600.ttf
          - rubik_700.ttf
          - rubik_800.ttf
    entitlements:
      path: Widget/PocketPassWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.xyz.pocketpass
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.pocketpass.PocketPass.widget
        PROVISIONING_PROFILE_SPECIFIER: $(POCKETPASS_WIDGET_PROFILE)
        SWIFT_VERSION: "5.0"
        SKIP_INSTALL: YES
