name: PocketPass
options:
  bundleIdPrefix: xyz.pocketpass
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    exactVersion: 12.19.2

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 72PMGDSD3B
    MARKETING_VERSION: "0.1.8"
    CURRENT_PROJECT_VERSION: "21"
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64

targets:
  PocketPass:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      - path: Resources/PrivacyInfo.xcprivacy
      - path: Resources/audio
        name: audio
        type: folder
        buildPhase: resources
      - path: ../app/src/main/assets/mii_renderer
        name: mii_renderer
        type: folder
        buildPhase: resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: PocketPass
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        FirebaseAppDelegateProxyEnabled: false
        FirebaseMessagingAutoInitEnabled: false
        FIREBASE_ANALYTICS_COLLECTION_ENABLED: false
        CADisableMinimumFrameDurationOnPhone: true
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: xyz.pocketpass.auth
            CFBundleURLSchemes:
              - pocketpass
        UIBackgroundModes: [fetch, bluetooth-central, bluetooth-peripheral]
        NSBluetoothAlwaysUsageDescription:
          PocketPass exchanges anonymous encounter passes with nearby players
          over Bluetooth, including while the app is in the background.
        NSMotionUsageDescription: PocketPass reads your daily step count to award tokens for walking.
        BGTaskSchedulerPermittedIdentifiers:
          - xyz.pocketpass.refresh
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: Sources/PocketPass.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
        com.apple.security.application-groups:
          - group.xyz.pocketpass
    dependencies:
      - target: PocketPassWidget
      - package: Firebase
        product: FirebaseMessaging
      - package: Firebase
        product: FirebaseCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.pocketpass.PocketPass
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PROVISIONING_PROFILE_SPECIFIER: $(POCKETPASS_APP_PROFILE)
        TARGETED_DEVICE_FAMILY: "1,2"
        APS_ENVIRONMENT: development
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../ui/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - PocketPassUi
      configs:
        Release:
          APS_ENVIRONMENT: production
    preBuildScripts:
      - name: Build the Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :ui:embedAndSignAppleFrameworkForXcode
    postBuildScripts:
      - name: Bundle the Firebase config when present
        basedOnDependencyAnalysis: false
        script: |
          config="$SRCROOT/Config/GoogleService-Info.plist"
          if [ -f "$config" ]; then
            cp "$config" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/GoogleService-Info.plist"
          fi

  PocketPassWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Widget
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: PocketPass
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - rubik_500.ttf
          - rubik_600.ttf
          - rubik_700.ttf
          - rubik_800.ttf
    entitlements:
      path: Widget/PocketPassWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.xyz.pocketpass
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.pocketpass.PocketPass.widget
        PROVISIONING_PROFILE_SPECIFIER: $(POCKETPASS_WIDGET_PROFILE)
        SWIFT_VERSION: "5.0"
        SKIP_INSTALL: YES
